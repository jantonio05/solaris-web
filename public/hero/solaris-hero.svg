<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111113;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1C1C1E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD60A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD60A" />
      <stop offset="100%" style="stop-color:#FF6B00" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="appClip">
      <rect x="340" y="60" width="820" height="490" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle glow behind app -->
  <ellipse cx="760" cy="300" rx="380" ry="260" fill="#FFD60A" opacity="0.03"/>

  <!-- ── LEFT SIDE: Branding ── -->

  <!-- Sun icon with glow -->
  <g filter="url(#glow)" transform="translate(60, 90)">
    <circle cx="40" cy="40" r="22" fill="#FFD60A" opacity="0.88"/>
    <g stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
      <line x1="40" y1="6"  x2="40" y2="15"/>
      <line x1="40" y1="65" x2="40" y2="74"/>
      <line x1="6"  y1="40" x2="15" y2="40"/>
      <line x1="65" y1="40" x2="74" y2="40"/>
      <line x1="14" y1="14" x2="21" y2="21"/>
      <line x1="59" y1="59" x2="66" y2="66"/>
      <line x1="66" y1="14" x2="59" y2="21"/>
      <line x1="21" y1="59" x2="14" y2="66"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="60" y="210" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', Helvetica, sans-serif"
    font-size="54" font-weight="200" fill="#FFFFFF" letter-spacing="-2">Solaris</text>

  <!-- Tagline -->
  <text x="60" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Helvetica, sans-serif"
    font-size="15" font-weight="400" fill="#6B6B6D" letter-spacing="0.2">Meteorología española · AEMET API</text>

  <!-- Divider line accent -->
  <rect x="60" y="268" width="48" height="2" rx="1" fill="url(#goldGrad)"/>

  <!-- Feature bullets -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', Helvetica, sans-serif" font-size="13" fill="#8E8E93">
    <text x="60" y="304">
      <tspan fill="#FFD60A" font-size="10">◆</tspan>
      <tspan dx="8">Pronóstico por hora y 7 días</tspan>
    </text>
    <text x="60" y="328">
      <tspan fill="#FFD60A" font-size="10">◆</tspan>
      <tspan dx="8">Avisos y alertas AEMET en tiempo real</tspan>
    </text>
    <text x="60" y="352">
      <tspan fill="#FFD60A" font-size="10">◆</tspan>
      <tspan dx="8">Índice UV, viento, presión y más</tspan>
    </text>
    <text x="60" y="376">
      <tspan fill="#FFD60A" font-size="10">◆</tspan>
      <tspan dx="8">Modo claro y oscuro · JavaFX</tspan>
    </text>
  </g>

  <!-- Tech badges -->
  <g transform="translate(60, 408)">
    <!-- JavaFX badge -->
    <rect width="68" height="24" rx="6" fill="#2C2C2E"/>
    <text x="34" y="16" text-anchor="middle" font-family="'Inter', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#EBEBF5">JavaFX</text>

    <!-- Java badge -->
    <rect x="76" width="52" height="24" rx="6" fill="#2C2C2E"/>
    <text x="102" y="16" text-anchor="middle" font-family="'Inter', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#EBEBF5">Java</text>

    <!-- AEMET badge -->
    <rect x="136" width="60" height="24" rx="6" fill="#1C3A2C"/>
    <text x="166" y="16" text-anchor="middle" font-family="'Inter', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#30D158">AEMET</text>
  </g>

  <!-- ── RIGHT SIDE: App Preview ── -->
  <g filter="url(#softShadow)">
    <rect x="340" y="60" width="820" height="490" rx="14" fill="#1C1C1E"/>
  </g>

  <!-- App frame clipped -->
  <g clip-path="url(#appClip)">

    <!-- Sidebar -->
    <rect x="340" y="60" width="210" height="490" fill="#111113"/>
    <rect x="549" y="60" width="0.5" height="490" fill="#3A3A3C" opacity="0.6"/>

    <!-- Sidebar: logo -->
    <text x="360" y="104" font-family="'Inter', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">Solaris</text>
    <text x="360" y="120" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">AEMET · España</text>

    <!-- Sidebar: search -->
    <rect x="356" y="130" width="178" height="26" rx="7" fill="#2C2C2E"/>
    <text x="375" y="147" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#6B6B6D">Buscar municipio...</text>

    <!-- Sidebar: section label -->
    <text x="360" y="175" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">MIS UBICACIONES</text>

    <!-- City items -->
    <rect x="352" y="182" width="192" height="38" rx="8" fill="#2C2C2E"/>
    <text x="366" y="198" font-family="'Inter', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#EBEBF5">Madrid</text>
    <text x="366" y="212" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">Despejado</text>
    <text x="510" y="205" font-family="'Inter', Helvetica, sans-serif" font-size="14" font-weight="300" fill="#FFFFFF">24°</text>

    <text x="366" y="237" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#EBEBF5">Barcelona</text>
    <text x="366" y="251" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">Nuboso</text>
    <text x="510" y="247" font-family="'Inter', Helvetica, sans-serif" font-size="14" font-weight="300" fill="#FFFFFF">21°</text>

    <text x="366" y="272" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#EBEBF5">Sevilla</text>
    <text x="366" y="286" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">Muy caluroso</text>
    <text x="510" y="282" font-family="'Inter', Helvetica, sans-serif" font-size="14" font-weight="300" fill="#FFFFFF">33°</text>

    <text x="366" y="307" font-family="'Inter', Helvetica, sans-serif" font-size="11" fill="#EBEBF5">Bilbao</text>
    <text x="366" y="321" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">Lluvia débil</text>
    <text x="510" y="317" font-family="'Inter', Helvetica, sans-serif" font-size="14" font-weight="300" fill="#FFFFFF">16°</text>

    <!-- Divider -->
    <rect x="360" y="336" width="176" height="0.5" fill="#3A3A3C"/>

    <!-- Alert box -->
    <rect x="356" y="346" width="184" height="66" rx="8" fill="#2C1A00"/>
    <rect x="356" y="346" width="184" height="66" rx="8" fill="none" stroke="#FF9500" stroke-width="0.5" opacity="0.8"/>
    <circle cx="368" cy="359" r="3.5" fill="#FF9500"/>
    <text x="376" y="362" font-family="'Inter', Helvetica, sans-serif" font-size="9" font-weight="500" fill="#FF9500">Aviso AEMET activo</text>
    <text x="364" y="377" font-family="'Inter', Helvetica, sans-serif" font-size="8.5" fill="#A06A20">Aviso amarillo por altas</text>
    <text x="364" y="389" font-family="'Inter', Helvetica, sans-serif" font-size="8.5" fill="#A06A20">temperaturas. Máx 36°C.</text>

    <!-- ── Main content ── -->

    <!-- Location header -->
    <circle cx="565" cy="96" r="4" fill="#0A84FF"/>
    <text x="575" y="100" font-family="'Inter', Helvetica, sans-serif" font-size="17" font-weight="500" fill="#FFFFFF" letter-spacing="-0.3">Madrid</text>
    <text x="558" y="116" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">Comunidad de Madrid · 667 m altitud · Sábado, 25 de abril · 12:04</text>

    <!-- Update badge -->
    <rect x="1060" y="82" width="88" height="20" rx="10" fill="#2C2C2E"/>
    <text x="1104" y="96" text-anchor="middle" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">hace 5 min</text>

    <!-- Big temperature -->
    <text x="558" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Inter', Helvetica, sans-serif" font-size="68" font-weight="200" fill="#FFFFFF" letter-spacing="-3">24°</text>
    <text x="558" y="216" font-family="'Inter', Helvetica, sans-serif" font-size="12" fill="#8E8E93">Parcialmente nublado</text>
    <text x="558" y="232" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#6B6B6D">Máx 28° · Mín 14° · Sens. térmica 22°</text>

    <!-- Sun illustration -->
    <circle cx="1090" cy="165" r="36" fill="#FFD60A" opacity="0.82" filter="url(#glow)"/>
    <g stroke="#FFD60A" stroke-width="2" stroke-linecap="round" opacity="0.35">
      <line x1="1090" y1="118" x2="1090" y2="126"/>
      <line x1="1090" y1="204" x2="1090" y2="212"/>
      <line x1="1043" y1="165" x2="1051" y2="165"/>
      <line x1="1129" y1="165" x2="1137" y2="165"/>
      <line x1="1057" y1="132" x2="1063" y2="138"/>
      <line x1="1117" y1="192" x2="1123" y2="198"/>
      <line x1="1123" y1="132" x2="1117" y2="138"/>
      <line x1="1063" y1="192" x2="1057" y2="198"/>
    </g>

    <!-- Hourly card -->
    <rect x="554" y="248" width="596" height="74" rx="10" fill="#2C2C2E"/>
    <text x="570" y="263" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">PRONÓSTICO POR HORA</text>

    <!-- Hours -->
    <g font-family="'Inter', Helvetica, sans-serif" text-anchor="middle">
      <!-- Ahora -->
      <text x="586" y="278" font-size="8" fill="#0A84FF">Ahora</text>
      <text x="586" y="294" font-size="13">⛅</text>
      <text x="586" y="312" font-size="9" fill="#FFFFFF">24°</text>

      <text x="636" y="278" font-size="8" fill="#6B6B6D">13h</text>
      <text x="636" y="294" font-size="13">☀️</text>
      <text x="636" y="312" font-size="9" fill="#FFFFFF">26°</text>

      <text x="686" y="278" font-size="8" fill="#6B6B6D">14h</text>
      <text x="686" y="294" font-size="13">☀️</text>
      <text x="686" y="312" font-size="9" fill="#FFFFFF">28°</text>

      <text x="736" y="278" font-size="8" fill="#6B6B6D">15h</text>
      <text x="736" y="294" font-size="13">⛅</text>
      <text x="736" y="312" font-size="9" fill="#FFFFFF">27°</text>

      <text x="786" y="278" font-size="8" fill="#6B6B6D">16h</text>
      <text x="786" y="294" font-size="13">🌦️</text>
      <text x="786" y="304" font-size="7.5" fill="#0A84FF">20%</text>
      <text x="786" y="312" font-size="9" fill="#FFFFFF">24°</text>

      <text x="836" y="278" font-size="8" fill="#6B6B6D">17h</text>
      <text x="836" y="294" font-size="13">🌧️</text>
      <text x="836" y="304" font-size="7.5" fill="#0A84FF">60%</text>
      <text x="836" y="312" font-size="9" fill="#FFFFFF">21°</text>

      <text x="886" y="278" font-size="8" fill="#6B6B6D">18h</text>
      <text x="886" y="294" font-size="13">🌧️</text>
      <text x="886" y="304" font-size="7.5" fill="#0A84FF">70%</text>
      <text x="886" y="312" font-size="9" fill="#FFFFFF">19°</text>

      <text x="936" y="278" font-size="8" fill="#6B6B6D">19h</text>
      <text x="936" y="294" font-size="13">🌦️</text>
      <text x="936" y="304" font-size="7.5" fill="#0A84FF">40%</text>
      <text x="936" y="312" font-size="9" fill="#FFFFFF">18°</text>

      <text x="986" y="278" font-size="8" fill="#6B6B6D">20h</text>
      <text x="986" y="294" font-size="13">🌙</text>
      <text x="986" y="312" font-size="9" fill="#FFFFFF">17°</text>

      <text x="1036" y="278" font-size="8" fill="#6B6B6D">21h</text>
      <text x="1036" y="294" font-size="13">🌙</text>
      <text x="1036" y="312" font-size="9" fill="#FFFFFF">16°</text>

      <text x="1086" y="278" font-size="8" fill="#6B6B6D">22h</text>
      <text x="1086" y="294" font-size="13">🌙</text>
      <text x="1086" y="312" font-size="9" fill="#FFFFFF">15°</text>
    </g>

    <!-- Metrics cards row -->
    <g>
      <!-- Humedad -->
      <rect x="554" y="334" width="138" height="66" rx="10" fill="#2C2C2E"/>
      <text x="570" y="350" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">HUMEDAD</text>
      <text x="570" y="374" font-family="'Inter', Helvetica, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF">52<tspan font-size="10" fill="#8E8E93">%</tspan></text>
      <text x="570" y="392" font-family="'Inter', Helvetica, sans-serif" font-size="8.5" fill="#6B6B6D">Punto de rocío 14°</text>

      <!-- Viento -->
      <rect x="700" y="334" width="138" height="66" rx="10" fill="#2C2C2E"/>
      <text x="716" y="350" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">VIENTO</text>
      <text x="716" y="374" font-family="'Inter', Helvetica, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF">18<tspan font-size="10" fill="#8E8E93"> km/h</tspan></text>
      <text x="716" y="392" font-family="'Inter', Helvetica, sans-serif" font-size="8.5" fill="#6B6B6D">SO · Ráfagas 34 km/h</text>

      <!-- Presión -->
      <rect x="846" y="334" width="138" height="66" rx="10" fill="#2C2C2E"/>
      <text x="862" y="350" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">PRESIÓN</text>
      <text x="862" y="374" font-family="'Inter', Helvetica, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF">1013<tspan font-size="10" fill="#8E8E93"> hPa</tspan></text>
      <text x="862" y="392" font-family="'Inter', Helvetica, sans-serif" font-size="8.5" fill="#30D158">Estable ↔</text>

      <!-- Precipitación -->
      <rect x="992" y="334" width="158" height="66" rx="10" fill="#2C2C2E"/>
      <text x="1008" y="350" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">PRECIPITACIÓN</text>
      <text x="1008" y="374" font-family="'Inter', Helvetica, sans-serif" font-size="22" font-weight="300" fill="#FFFFFF">0<tspan font-size="10" fill="#8E8E93"> mm</tspan></text>
      <text x="1008" y="392" font-family="'Inter', Helvetica, sans-serif" font-size="8.5" fill="#6B6B6D">Tarde: posible 4 mm</text>
    </g>

    <!-- Forecast card -->
    <rect x="554" y="412" width="430" height="120" rx="10" fill="#2C2C2E"/>
    <text x="570" y="428" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">PRÓXIMOS 7 DÍAS</text>

    <g font-family="'Inter', Helvetica, sans-serif" font-size="10">
      <!-- Row 1 -->
      <text x="570" y="446" fill="#EBEBF5">Hoy</text>
      <text x="618" y="446" fill="#FFFFFF" font-size="12">⛅</text>
      <text x="648" y="446" fill="#0A84FF" font-size="9">40%</text>
      <text x="698" y="446" fill="#6B6B6D">14°</text>
      <rect x="720" y="439" width="70" height="3" rx="1.5" fill="#3A3A3C"/>
      <rect x="720" y="439" width="70" height="3" rx="1.5" fill="url(#barGrad)"/>
      <text x="798" y="446" fill="#FFFFFF">28°</text>

      <!-- Row 2 -->
      <text x="570" y="462" fill="#EBEBF5">Dom</text>
      <text x="618" y="462" fill="#FFFFFF" font-size="12">🌧️</text>
      <text x="648" y="462" fill="#0A84FF" font-size="9">80%</text>
      <text x="698" y="462" fill="#6B6B6D">12°</text>
      <rect x="720" y="455" width="70" height="3" rx="1.5" fill="#3A3A3C"/>
      <rect x="720" y="455" width="48" height="3" rx="1.5" fill="url(#barGrad)"/>
      <text x="798" y="462" fill="#FFFFFF">22°</text>

      <!-- Row 3 -->
      <text x="570" y="478" fill="#EBEBF5">Lun</text>
      <text x="618" y="478" fill="#FFFFFF" font-size="12">🌦️</text>
      <text x="648" y="478" fill="#0A84FF" font-size="9">50%</text>
      <text x="698" y="478" fill="#6B6B6D">13°</text>
      <rect x="720" y="471" width="70" height="3" rx="1.5" fill="#3A3A3C"/>
      <rect x="720" y="471" width="54" height="3" rx="1.5" fill="url(#barGrad)"/>
      <text x="798" y="478" fill="#FFFFFF">24°</text>

      <!-- Row 4 -->
      <text x="570" y="494" fill="#EBEBF5">Mar</text>
      <text x="618" y="494" fill="#FFFFFF" font-size="12">☀️</text>
      <text x="698" y="494" fill="#6B6B6D">14°</text>
      <rect x="720" y="487" width="70" height="3" rx="1.5" fill="#3A3A3C"/>
      <rect x="720" y="487" width="60" height="3" rx="1.5" fill="url(#barGrad)"/>
      <text x="798" y="494" fill="#FFFFFF">26°</text>

      <!-- Row 5 -->
      <text x="570" y="510" fill="#EBEBF5">Mié</text>
      <text x="618" y="510" fill="#FFFFFF" font-size="12">☀️</text>
      <text x="698" y="510" fill="#6B6B6D">16°</text>
      <rect x="720" y="503" width="70" height="3" rx="1.5" fill="#3A3A3C"/>
      <rect x="720" y="503" width="70" height="3" rx="1.5" fill="url(#barGrad)"/>
      <text x="798" y="510" fill="#FFFFFF">30°</text>
    </g>

    <!-- Side cards: UV + Moon -->
    <rect x="992" y="412" width="158" height="56" rx="10" fill="#2C2C2E"/>
    <text x="1008" y="428" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">ÍNDICE UV</text>
    <text x="1008" y="449" font-family="'Inter', Helvetica, sans-serif" font-size="20" font-weight="300" fill="#FFD60A">6 <tspan font-size="10" fill="#8E8E93">Alto</tspan></text>
    <rect x="1008" y="453" width="126" height="4" rx="2" fill="#3A3A3C"/>
    <rect x="1008" y="453" width="70" height="4" rx="2" fill="url(#goldGrad)"/>

    <rect x="992" y="476" width="158" height="56" rx="10" fill="#2C2C2E"/>
    <text x="1008" y="492" font-family="'Inter', Helvetica, sans-serif" font-size="8" font-weight="500" fill="#6B6B6D" letter-spacing="0.8">FASE LUNAR</text>
    <text x="1008" y="518" font-family="'Inter', Helvetica, sans-serif" font-size="22">🌓</text>
    <text x="1042" y="508" font-family="'Inter', Helvetica, sans-serif" font-size="10" fill="#EBEBF5">Cuarto creciente</text>
    <text x="1042" y="522" font-family="'Inter', Helvetica, sans-serif" font-size="9" fill="#6B6B6D">48% iluminado</text>

  </g>

  <!-- App border overlay -->
  <rect x="340" y="60" width="820" height="490" rx="14" fill="none" stroke="#3A3A3C" stroke-width="0.5"/>

</svg>
