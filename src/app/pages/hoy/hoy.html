<solaris-header />

<main>
  <div class="hero bg-base-200 min-h-screen">
    <div class="hero-content">
      @if (!estaCargando) {
        <tarjeta-hoy [hoy]="tiempoHoy" />
      } @else {
        <div class="grid justify-items-center gap-12">
          <span class="col loading loading-spinner loading-xl"></span>
          <button class="col btn btn-primary" routerLink="/inicio">Volver a inicio</button>
        </div>
      }
    </div>
  </div>
</main>

<solaris-footer />
